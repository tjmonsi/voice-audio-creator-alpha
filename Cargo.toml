[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.21"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
pulldown-cmark = { version = "=0.13.4", default-features = false }
hound = "=3.5.1"
dirs = "=7.0.0"
sha2 = "=0.11.0"
ctrlc = "=3.5.2"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
