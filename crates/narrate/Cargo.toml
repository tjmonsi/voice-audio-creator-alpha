[package]
name = "narrate"
description = "Turn a Markdown or text script into a narrated WAV file with Chatterbox-Turbo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "narrate"
path = "src/main.rs"

[features]
# Test builds only: honors NARRATE_WORKER_CMD, NARRATE_UV, and the NARRATE_TEST_* variables.
test-hooks = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
dirs.workspace = true
narrate-core = { path = "../narrate-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
windows-sys.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
hound.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true
